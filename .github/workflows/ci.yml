name: Backend quality
on:
  pull_request:
  push:
    branches: [main, develop, pre-develop]
permissions:
  contents: read
jobs:
  api:
    name: Express API and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: boticaya_test
          POSTGRES_DB: boticaya_api_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boticaya_test -d boticaya_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BOTICAYA_TEST_DATABASE_URL: postgresql://boticaya_test@127.0.0.1:5432/boticaya_api_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm build
